<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macks Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#06223a;--bg2:#0b4a63;--panel:rgba(8,32,52,.72);--line:rgba(140,220,255,.25);--text:#eaf6ff;--mute:#8fb4c9;--gold:#ffc83d;--win:#2fe27a;--lose:#ff4057;--tie:#ffd21f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#08334d);background-size:200% 200%;animation:sea 18s ease-in-out infinite alternate;overflow-x:hidden}
@keyframes sea{to{background-position:100% 100%}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 10%,rgba(255,200,61,.16),transparent 40%),radial-gradient(circle at 10% 90%,rgba(60,200,255,.14),transparent 45%)}
header{padding:18px 26px}
.logo{font-family:'Lilita One',Impact,sans-serif;font-size:clamp(28px,4vw,40px);color:#fff;margin:0;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35);display:inline-block}
main{position:relative;max-width:1000px;margin:0 auto;padding:0 18px 48px}
#result{margin:6px auto 26px;max-width:560px;text-align:center;border:4px solid var(--line);border-radius:18px;padding:14px 18px;background:var(--panel);transition:border-color .3s,box-shadow .3s}
#result h2{margin:0;font-family:'Lilita One',Impact,sans-serif;font-size:clamp(28px,5vw,42px);font-weight:400}
#result p{margin:4px 0 0;color:var(--mute);font-weight:800}
#result.win{border-color:var(--win);box-shadow:0 0 30px rgba(47,226,122,.45)}
#result.win h2{color:var(--win)}
#result.lose{border-color:var(--lose);box-shadow:0 0 30px rgba(255,64,87,.45)}
#result.lose h2{color:var(--lose)}
#result.tie{border-color:var(--tie);box-shadow:0 0 30px rgba(255,210,31,.45)}
#result.tie h2{color:var(--tie)}
#result.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:.2}100%{transform:scale(1);opacity:1}}
.windows{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.win-box{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(6px)}
.win-box h3{margin:0 0 12px;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:24px;display:flex;justify-content:space-between;align-items:baseline}
.win-box h3 span{font-family:'Nunito',sans-serif;font-size:15px;color:var(--gold);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{position:relative;aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.04);color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;transition:transform .15s,border-color .15s,background .15s}
.cell:hover{transform:translateY(-3px) scale(1.04);border-color:var(--gold);background:rgba(255,200,61,.1)}
.cell:active{transform:scale(.95)}
.cell:focus-visible,.btn:focus-visible,.opt:focus-visible,#q:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cell .plus{font-size:30px;color:var(--mute);line-height:1}
.cell.full{border-style:solid;border-color:var(--c,var(--gold));background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.cell .nm{font-weight:800;font-size:clamp(10px,1.7vw,13px);line-height:1.1;text-align:center;word-break:break-word}
.cell .vl{font-size:clamp(10px,1.6vw,12px);color:var(--c,var(--gold));font-weight:800}
.cell .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.45);font-size:13px;line-height:20px;text-align:center;opacity:0;transition:opacity .15s}
.cell.full:hover .x,.cell.full:focus-within .x{opacity:1}
.actions{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn{font-family:'Lilita One',Impact,sans-serif;font-size:22px;border:0;border-radius:14px;padding:14px 44px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.btn.done{color:#2a1a00;background:linear-gradient(180deg,#ffe27a,var(--gold) 60%,#f0a000);box-shadow:0 6px 0 #a56a00,0 10px 24px rgba(255,200,61,.35);animation:glow 2.4s ease-in-out infinite}
.btn.done::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.btn.done:hover::after{left:130%;transition:left .7s}
.btn.done:hover{transform:translateY(-3px)}
.btn.done:active{transform:translateY(4px);box-shadow:0 2px 0 #a56a00}
.btn.reset{color:var(--text);background:rgba(255,255,255,.08);border:2px solid var(--line);padding:12px 30px}
.btn.reset:hover{background:rgba(255,255,255,.18);transform:translateY(-3px)}
.btn.reset:active{transform:scale(.95)}
@keyframes glow{50%{box-shadow:0 6px 0 #a56a00,0 10px 38px rgba(255,200,61,.7)}}
#modal{position:fixed;inset:0;background:rgba(2,12,22,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;backdrop-filter:blur(3px)}
#modal.open{display:flex}
.sheet{width:min(460px,100%);max-height:80vh;display:flex;flex-direction:column;background:#0a2c46;border:2px solid var(--line);border-radius:18px;padding:16px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
#q{width:100%;font:inherit;font-weight:800;font-size:17px;color:var(--text);background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
#list{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;font:inherit;font-weight:800;color:var(--text);text-align:left;background:rgba(255,255,255,.05);border:0;border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;transition:background .12s,transform .12s}
.opt:hover{background:rgba(255,200,61,.18);transform:translateX(4px)}
.opt b{color:var(--c);white-space:nowrap}
.none{color:var(--mute);text-align:center;padding:18px;font-weight:800}
.rm{margin-top:10px;font:inherit;font-weight:800;color:#ff9aa6;background:none;border:2px solid rgba(255,64,87,.5);border-radius:10px;padding:8px;cursor:pointer}
.rm:hover{background:rgba(255,64,87,.15)}
@media(max-width:640px){.windows{grid-template-columns:1fr}header{padding:14px 16px}.btn{padding:12px 34px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1 class="logo">Macks Values</h1></header>
<main>
  <section id="result" aria-live="polite"><h2>Build your trade</h2><p>Pick items for both offers, then press Done.</p></section>
  <div class="windows">
    <section class="win-box"><h3>Your offer <span id="ta">0</span></h3><div class="grid" id="ga"></div></section>
    <section class="win-box"><h3>Other offer <span id="tb">0</span></h3><div class="grid" id="gb"></div></section>
  </div>
  <div class="actions">
    <button class="btn done" id="done">Done</button>
    <button class="btn reset" id="reset">Reset</button>
  </div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-label="Choose an item">
  <div class="sheet">
    <input id="q" type="search" placeholder="Search items" autocomplete="off">
    <div id="list"></div>
    <button class="rm" id="rm" hidden>Remove item from this cell</button>
  </div>
</div>
<script>
const RAW="Blizzard|26;Shadow|15;Mammoth|28;Gravity|31;Pain|48;Spirit|36;Lime Blade|28.5;Buddha|60;Portal|62.5;Celebration Bomb|42;Topaz Diamond|66.5;T-Rex|105;Venom|53;Glacier Eagle|40;Scarlet Ghost|53;Dough|120;Lightning|74;Gas|260;Yeti|435;Tiger|450;Torment Pain|470;Control|500;Ruby Diamond|510;Requirem Eagle|545;Yellow Lightning|480;Emerald Diamond|530;Green Lightning|635;Rose Quartz Diamond|610;Fast Boats Pass|480;X2 Boss Drops Pass|430;Starlight Gravity|800;Matrix Eagle|640;+1 Fruit Storage Pass|800;Thermite Bomb|965;X2 Mastery Pass|800;X2 Money Pass|800;Legendary Scrolls Product|1100;Kitsune|1250;Nuclear Bomb|990;Azura Bomb|1000;Frustration Pain|1500;Sadness Pain|1450;Magnet|1400;Celestial Pain|1750;Dark Blade Pass|2000;Fiend Yeti|2680;Mythic Scrolls Product|3750;Werewolf Tiger|2830;Dog Blade|2950;Runic Fiend Yeti|3275;Divine Portal|3600;Red Lightning|4150;Super Spirit Pain|4900;East Dragon|4750;Arcsteel Magnet|4300;Fruit Notifier Pass|5000;West Dragon|5000;Purple Lightning|7880;Meme|8290;Dragon Token|9835;Ember Dragon|9585;Parrot Eagle|11800;Crimson Kitsune|12500;Galaxy Kitsune|15000;Rabid Dog Blade|30000;Vibe (Frame Break)|21000;Doghouse (Frame Break)|24000;Eclipse Dragon|75000;Permanent Dragon Token|32000";
const ITEMS=RAW.split(";").map(s=>{const[n,v]=s.split("|");return{n,v:+v}}).sort((a,b)=>b.v-a.v);
const tier=v=>v>=20000?"#ff5fd2":v>=5000?"#b98cff":v>=1000?"#4db8ff":v>=200?"#3be0c2":v>=50?"#ffc83d":"#c3d3dc";
const fmt=v=>v.toLocaleString("en-US");
const S={a:Array(9).fill(null),b:Array(9).fill(null)};
let cur=null;
const $=id=>document.getElementById(id);

function render(){
  for(const k of["a","b"]){
    const g=$("g"+k);g.innerHTML="";
    S[k].forEach((it,i)=>{
      const b=document.createElement("button");
      b.className="cell"+(it?" full":"");
      b.setAttribute("aria-label",it?it.n+", value "+it.v:"Empty cell, choose item");
      if(it){
        b.style.setProperty("--c",tier(it.v));
        b.innerHTML='<span class="nm"></span><span class="vl">'+fmt(it.v)+'</span><span class="x" aria-hidden="true">×</span>';
        b.querySelector(".nm").textContent=it.n;
        b.querySelector(".x").onclick=e=>{e.stopPropagation();S[k][i]=null;changed()};
      }else b.innerHTML='<span class="plus">+</span>';
      b.onclick=()=>openModal(k,i);
      g.appendChild(b);
    });
    $("t"+k).textContent=fmt(sum(k));
  }
}
const sum=k=>S[k].reduce((t,i)=>t+(i?i.v:0),0);
function neutral(){const r=$("result");r.className="";r.innerHTML="<h2>Build your trade</h2><p>Pick items for both offers, then press Done.</p>"}
function changed(){neutral();render()}

function openModal(k,i){
  cur={k,i};$("q").value="";fill("");
  $("rm").hidden=!S[k][i];
  $("modal").classList.add("open");$("q").focus();
}
function closeModal(){$("modal").classList.remove("open");cur=null}
function fill(t){
  const l=$("list");l.innerHTML="";t=t.trim().toLowerCase();
  const m=ITEMS.filter(x=>x.n.toLowerCase().includes(t));
  if(!m.length){l.innerHTML='<div class="none">No items match your search.</div>';return}
  m.forEach(x=>{
    const b=document.createElement("button");b.className="opt";b.style.setProperty("--c",tier(x.v));
    b.innerHTML="<span></span><b>"+fmt(x.v)+"</b>";b.firstChild.textContent=x.n;
    b.onclick=()=>{S[cur.k][cur.i]=x;closeModal();changed()};
    l.appendChild(b);
  });
}
$("q").oninput=e=>fill(e.target.value);
$("q").onkeydown=e=>{if(e.key==="Enter"){const f=$("list").querySelector(".opt");if(f)f.click()}};
$("rm").onclick=()=>{S[cur.k][cur.i]=null;closeModal();changed()};
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

$("done").onclick=()=>{
  const a=sum("a"),b=sum("b"),r=$("result");
  if(!a&&!b){neutral();return}
  let cls,txt;
  if(a>b){cls="lose";txt="Lose Trade"}else if(a<b){cls="win";txt="Win Trade"}else{cls="tie";txt="Tie Trade"}
  r.className=cls;
  r.innerHTML="<h2>"+txt+"</h2><p>Your offer "+fmt(a)+" vs Other offer "+fmt(b)+"</p>";
  void r.offsetWidth;r.classList.add("pop");
};
$("reset").onclick=()=>{S.a.fill(null);S.b.fill(null);changed()};
render();
</script>
</body>
</html>
