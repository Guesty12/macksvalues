<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="the magnificent values of roblox game - Blox Fruits">
<title>Macks Values - All Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#06223a;--bg2:#0b4a63;--panel:rgba(8,32,52,.72);--line:rgba(140,220,255,.25);--text:#eaf6ff;--mute:#8fb4c9;--gold:#ffc83d;--legendary:#ffc83d;--mythic:#b98cff;--premium:#ff5fd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#08334d);background-size:200% 200%;animation:sea 18s ease-in-out infinite alternate;overflow-x:hidden}
@keyframes sea{to{background-position:100% 100%}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 10%,rgba(255,200,61,.16),transparent 40%),radial-gradient(circle at 10% 90%,rgba(60,200,255,.14),transparent 45%)}
header{position:relative;padding:18px 26px}
.logo{font-family:'Lilita One',Impact,sans-serif;font-size:clamp(28px,4vw,40px);color:#fff;margin:0;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35);display:inline-block}
.logo a{color:inherit;text-decoration:none}
.logo-ico{height:1em;width:1em;vertical-align:-.12em;margin-left:.08em;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
main{position:relative;max-width:1000px;margin:0 auto;padding:0 18px 48px}
.frame{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(6px)}
.frame h2{margin:0 0 12px;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:24px;display:flex;justify-content:space-between;align-items:baseline}
.frame h2 span{font-family:'Nunito',sans-serif;font-size:15px;color:var(--gold);font-weight:800}
#q{width:100%;font:inherit;font-weight:800;font-size:17px;color:var(--text);background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
#q:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.scroll{height:min(64vh,620px);overflow-y:auto;padding:4px 6px 6px 2px;scrollbar-color:var(--line) transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cell{aspect-ratio:1;border:2px solid var(--c);border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:transform .15s,border-color .15s,background .15s;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.cell:hover{transform:translateY(-3px) scale(1.04);background:rgba(255,200,61,.1)}
.cell:active{transform:scale(.95)}
.cell .nm{font-weight:800;font-size:clamp(12px,1.8vw,14px);line-height:1.1;text-align:center;word-break:break-word}
.cell .vl{font-size:13px;color:var(--c);font-weight:800}
.none{color:var(--mute);text-align:center;padding:28px;font-weight:800}
.actions{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn{font-family:'Lilita One',Impact,sans-serif;font-size:22px;border:0;border-radius:14px;padding:14px 44px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;text-decoration:none;display:inline-block;text-align:center}
.btn.done{color:#2a1a00;background:linear-gradient(180deg,#ffe27a,var(--gold) 60%,#f0a000);box-shadow:0 6px 0 #a56a00,0 10px 24px rgba(255,200,61,.35);animation:glow 2.4s ease-in-out infinite}
.btn.done::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.btn.done:hover::after{left:130%;transition:left .7s}
.btn.done:hover{transform:translateY(-3px)}
.btn.done:active{transform:translateY(4px);box-shadow:0 2px 0 #a56a00}
.btn.reset{color:var(--text);background:rgba(255,255,255,.08);border:2px solid var(--line);padding:12px 30px}
.btn.reset:hover{background:rgba(255,255,255,.18);transform:translateY(-3px)}
.btn.reset:active{transform:scale(.95)}
@keyframes glow{50%{box-shadow:0 6px 0 #a56a00,0 10px 38px rgba(255,200,61,.7)}}
@keyframes pop{0%{transform:scale(.7);opacity:.2}100%{transform:scale(1);opacity:1}}
#modal{position:fixed;inset:0;background:rgba(2,12,22,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;backdrop-filter:blur(3px)}
#modal.open{display:flex}
.sheet{width:min(400px,100%);text-align:center;background:#0a2c46;border:4px solid var(--c,var(--line));box-shadow:0 0 30px var(--g,transparent);border-radius:18px;padding:24px 18px 18px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.sheet h3{margin:0;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:clamp(28px,6vw,38px);color:#fff}
.sheet .val{margin:10px 0 0;font-family:'Lilita One',Impact,sans-serif;font-size:34px;color:var(--c)}
.sheet .lbl{margin:0;color:var(--mute);font-weight:800;font-size:14px}
.badge{display:inline-block;margin:14px 0 20px;font-family:'Lilita One',Impact,sans-serif;font-size:22px;color:#1a0f00;background:var(--c);border-radius:999px;padding:6px 22px}
@media(max-width:640px){header{padding:14px 16px}.btn{padding:12px 34px}.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<main>
  <section class="frame">
    <h2>All values <span id="cnt">0</span></h2>
    <input id="q" type="search" placeholder="Search items" aria-label="Search items" autocomplete="off">
    <div class="scroll" tabindex="0" aria-label="Item list"><div class="grid" id="grid"></div></div>
  </section>
  <div class="actions">
    <a class="btn done" href="https://macksvalues.vercel.app">Trade</a>
  </div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-label="Item details">
  <div class="sheet" id="sheet">
    <h3 id="mn"></h3>
    <p class="val" id="mv"></p>
    <p class="lbl">Value</p>
    <span class="badge" id="mr"></span><br>
    <button class="btn reset" id="close">Close</button>
  </div>
</div>
<script>
const RAW="Blizzard|26;Shadow|25;Mammoth|28;Gravity|31;Pain|48;Spirit|36;Lime Blade|28;Buddha|56;Portal|56;Celebration Bomb|42;Topaz Diamond|64;T-Rex|105;Venom|65;Glacier Eagle|40;Scarlet Ghost|51;Dough|120;Lightning|74;Gas|260;Yeti|430;Tiger|450;Torment Pain|410;Control|500;Ruby Diamond|510;Requirem Eagle|545;Yellow Lightning|480;Emerald Diamond|530;Green Lightning|635;Rose Quartz Diamond|610;Fast Boats Pass|480;X2 Boss Drops Pass|430;Starlight Gravity|800;Matrix Eagle|640;+1 Fruit Storage Pass|800;Thermite Bomb|965;X2 Mastery Pass|800;X2 Money Pass|800;Legendary Scrolls Product|1100;Kitsune|1250;Nuclear Bomb|990;Azura Bomb|1000;Frustration Pain|1500;Sadness Pain|1450;Magnet|1400;Celestial Pain|1750;Dark Blade Pass|2000;Fiend Yeti|2680;Mythic Scrolls Product|3750;Werewolf Tiger|2830;Dog Blade|2950;Runic Fiend Yeti|3275;Divine Portal|3600;Red Lightning|4150;Super Spirit Pain|4900;East Dragon|4750;Arcsteel Magnet|4300;Fruit Notifier Pass|5000;West Dragon|5000;Purple Lightning|7880;Meme|8290;Dragon Token|9835;Ember Dragon|9585;Parrot Eagle|11800;Crimson Kitsune|12500;Galaxy Kitsune|15000;Rabid Dog Blade|30000;Vibe (Frame Break)|21000;Doghouse (Frame Break)|24000;Eclipse Dragon|75000;Permanent Dragon Token|32000";
const ITEMS=RAW.split(";").map(s=>{const[n,v]=s.split("|");return{n,v:+v}}).sort((a,b)=>b.v-a.v);
const rarity=v=>v>9000?{name:"Premium",c:"#ff5fd2",g:"rgba(255,95,210,.45)"}:v>25?{name:"Mythic",c:"#b98cff",g:"rgba(185,140,255,.45)"}:{name:"Legendary",c:"#ffc83d",g:"rgba(255,200,61,.45)"};
const fmt=v=>v.toLocaleString("en-US");
const $=id=>document.getElementById(id);

function fill(t){
  const g=$("grid");g.innerHTML="";t=t.trim().toLowerCase();
  const m=ITEMS.filter(x=>x.n.toLowerCase().includes(t));
  $("cnt").textContent=m.length+" items";
  if(!m.length){g.innerHTML='<div class="none">No items match your search.</div>';return}
  m.forEach(x=>{
    const b=document.createElement("button");b.className="cell";
    b.style.setProperty("--c",rarity(x.v).c);
    b.setAttribute("aria-label",x.n+", value "+x.v+", "+rarity(x.v).name);
    b.innerHTML='<span class="nm"></span><span class="vl">'+fmt(x.v)+'</span>';
    b.querySelector(".nm").textContent=x.n;
    b.onclick=()=>openModal(x);
    g.appendChild(b);
  });
}
function openModal(x){
  const r=rarity(x.v),s=$("sheet");
  s.style.setProperty("--c",r.c);s.style.setProperty("--g",r.g);
  $("mn").textContent=x.n;$("mv").textContent=fmt(x.v);$("mr").textContent=r.name;
  $("modal").classList.add("open");$("close").focus();
}
function closeModal(){$("modal").classList.remove("open")}
$("q").oninput=e=>fill(e.target.value);
$("close").onclick=closeModal;
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
fill("");
</script>
